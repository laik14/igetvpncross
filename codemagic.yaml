workflows:
  android-release:
    name: Android Release Build (APK & AAB)
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.wireguard.nativemobile"
      node: 20
      java: 17
    scripts:
      - name: Install web dependencies
        script: |
          npm ci || npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Build Android release
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            export ANDROID_KEYSTORE_PATH="$CM_BUILD_DIR/android/release.keystore"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          fi
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - ya@laik14.ru

  ios-testflight:
    name: iOS TestFlight Build (IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.wireguard.nativemobile
      vars:
        XCODE_PROJECT: "ios/App/WireGuardNative.xcodeproj"
        XCODE_SCHEME: "App"
        DEVELOPMENT_TEAM: Encrypted
      node: 20
      xcode: latest
    scripts:
      - name: Install web dependencies
        script: |
          npm ci || npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Generate Xcode project
        script: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          cd ios/App
          xcodegen generate
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
